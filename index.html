<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>趣味學幾何：認識菱形</title>
    <style>
        :root {
            --primary-color: #FF5964;
            --secondary-color: #35A7FF;
            --accent-color: #FFE66D;
            --bg-color: #F0F7F4;
            --card-bg: #FFFFFF;
            --text-color: #2E4057;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: "Chalkboard SE", "Comic Sans MS", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.2rem;
            margin: 10px 0;
            text-align: center;
            color: var(--primary-color);
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
        }

        /* 頂部頁籤選單 */
        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 850px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 3px solid var(--secondary-color);
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            box-shadow: 0 5px 0 var(--secondary-color);
            transition: all 0.1s ease;
        }

        .tab-btn:active, .tab-btn.active {
            background-color: var(--secondary-color);
            color: white;
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--secondary-color);
        }

        /* 主內容卡片 */
        .card {
            background-color: var(--card-bg);
            border-radius: 30px;
            padding: 25px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card.active {
            display: flex;
        }

        /* SEN 提示框 */
        .instruction-box {
            background-color: #FFF9A6;
            border: 3px dashed #F4D35E;
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        /* 按鈕風格 */
        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #D1404B;
            transition: all 0.1s;
            margin: 8px;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #D1404B;
        }

        .speech-btn {
            background-color: #06D6A0;
            box-shadow: 0 4px 0 #049A73;
            padding: 8px 15px;
            font-size: 1rem;
            border-radius: 20px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* 畫布容器 */
        .canvas-container {
            border: 4px solid #E0E0E0;
            border-radius: 20px;
            background-color: #FAFAFA;
            touch-action: none;
            position: relative;
        }

        /* 滑桿控制 */
        .slider-container {
            margin: 20px 0;
            width: 80%;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        input[type=range] {
            flex: 1;
            height: 20px;
            border-radius: 10px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* 第二關：分類遊戲 */
        .drop-zones-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 15px;
            margin-bottom: 20px;
        }

        .drop-zone {
            flex: 1;
            height: 180px;
            border: 4px dashed var(--secondary-color);
            border-radius: 25px;
            background-color: #F0F8FF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .shape-pool {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            flex-wrap: wrap;
        }

        .shape-item {
            width: 80px;
            height: 80px;
            cursor: grab;
            touch-action: none;
        }

        /* 第四關：尋寶網格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }

        .grid-item {
            background-color: #F8F9FA;
            border: 3px solid #E9ECEF;
            border-radius: 20px;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .grid-item.correct {
            border-color: #06D6A0;
            background-color: #E8FAEB;
            transform: scale(1.03);
        }

        .grid-item.wrong {
            border-color: #FF5964;
            background-color: #FFE8E8;
        }

        /* 獎勵特效彈窗 */
        .reward-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .reward-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #FFD166;
            text-shadow: 2px 2px 0 #000;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0% { transform: scale(0.3); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>💎 趣味學幾何：菱形大冒險 💎</h1>

    <!-- 頂部頁籤選單 -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab(0)">1. 動手按壓變菱形</button>
        <button class="tab-btn" onclick="switchTab(1)">2. 菱形性質分類</button>
        <button class="tab-btn" onclick="switchTab(2)">3. 互動電子釘板</button>
        <button class="tab-btn" onclick="switchTab(3)">4. 生活中的菱形</button>
    </div>

    <!-- 第一關：動手按壓 (正方形變菱形) -->
    <div class="card active" id="tab-0">
        <div class="instruction-box">
            <span>📢 拉動下方的滑桿，看看正方形按壓後會變成甚麼！</span>
            <button class="speech-btn" onclick="speak('拉動下方的滑桿，看看正方形按壓後會變成甚麼！')">🔊 聽語音</button>
        </div>
        
        <div class="canvas-container">
            <canvas id="canvas-press" width="360" height="360"></canvas>
        </div>

        <div class="slider-container">
            <span>正方形</span>
            <input type="range" id="skewSlider" min="0" max="45" value="0" oninput="drawPressCanvas()">
            <span>菱形</span>
        </div>

        <button class="action-btn" onclick="speak('正方形被按壓傾斜後，4條邊的長度依然相等，這就是菱形！')">💡 聽聽菱形的秘密</button>
    </div>

    <!-- 第二關：分類遊戲 (性質大發現) -->
    <div class="card" id="tab-1">
        <div class="instruction-box">
            <span>📢 請把「菱形」拖拉放到左邊的寶箱，其他的放到右邊！</span>
            <button class="speech-btn" onclick="speak('請把菱形拖拉放到左邊的寶箱，其他的放到右邊！')">🔊 聽語音</button>
        </div>

        <div class="drop-zones-container">
            <div class="drop-zone" id="rhombus-box" data-target="rhombus">
                💎 菱形寶箱
                <div id="rhombus-count" style="font-size: 1.8rem; color: var(--primary-color); margin-top: 10px;">0 / 2</div>
            </div>
            <div class="drop-zone" id="other-box" data-target="other">
                📦 其他四邊形
                <div id="other-count" style="font-size: 1.8rem; color: var(--secondary-color); margin-top: 10px;">0 / 2</div>
            </div>
        </div>

        <div class="shape-pool" id="shape-pool">
            <svg class="shape-item" id="shape-1" data-type="rhombus" viewBox="0 0 100 100">
                <polygon points="50,10 90,50 50,90 10,50" fill="#FF5964" stroke="#2E4057" stroke-width="4"/>
            </svg>
            <svg class="shape-item" id="shape-2" data-type="other" viewBox="0 0 100 100">
                <rect x="10" y="25" width="80" height="50" fill="#35A7FF" stroke="#2E4057" stroke-width="4"/>
            </svg>
            <svg class="shape-item" id="shape-3" data-type="rhombus" viewBox="0 0 100 100">
                <polygon points="50,5 85,50 50,95 15,50" fill="#FFE66D" stroke="#2E4057" stroke-width="4"/>
            </svg>
            <svg class="shape-item" id="shape-4" data-type="other" viewBox="0 0 100 100">
                <polygon points="25,20 75,20 90,80 10,80" fill="#06D6A0" stroke="#2E4057" stroke-width="4"/>
            </svg>
        </div>
    </div>

    <!-- 第三關：電子釘板 (繪畫與製作) -->
    <div class="card" id="tab-2">
        <div class="instruction-box">
            <span>📢 依次點擊 4 個釘點，圍出一個4條邊一樣長的菱形！</span>
            <button class="speech-btn" onclick="speak('依次點擊4個釘點，圍出一個4條邊一樣長的菱形！')">🔊 聽語音</button>
        </div>

        <div class="canvas-container">
            <canvas id="canvas-geoboard" width="360" height="360"></canvas>
        </div>

        <div style="margin-top: 15px;">
            <button class="action-btn" style="background-color: var(--secondary-color); box-shadow: 0 6px 0 #2882C7;" onclick="toggleDiagonalGuide()">✂️ 十字輔助線</button>
            <button class="action-btn" style="background-color: #8D99AE; box-shadow: 0 6px 0 #6C757D;" onclick="resetGeoboard()">🔄 清除重畫</button>
        </div>
    </div>

    <!-- 第四關：生活中的菱形 -->
    <div class="card" id="tab-3">
        <div class="instruction-box">
            <span>📢 點擊下方物品，找出含有「菱形」圖案的物品！</span>
            <button class="speech-btn" onclick="speak('點擊下方物品，找出含有菱形圖案的物品！')">🔊 聽語音</button>
        </div>

        <div class="grid-container">
            <div class="grid-item" onclick="checkTreasure(this, true)">
                <span style="font-size: 3rem;">🪁</span>
                <span>彩色風箏</span>
            </div>
            <div class="grid-item" onclick="checkTreasure(this, false)">
                <span style="font-size: 3rem;">📺</span>
                <span>電視機</span>
            </div>
            <div class="grid-item" onclick="checkTreasure(this, true)">
                <span style="font-size: 3rem;">♦️</span>
                <span>撲克牌方塊</span>
            </div>
            <div class="grid-item" onclick="checkTreasure(this, true)">
                <span style="font-size: 3rem;">菱形</span>
                <span>道路標誌</span>
            </div>
            <div class="grid-item" onclick="checkTreasure(this, false)">
                <span style="font-size: 3rem;">⚽</span>
                <span>足球</span>
            </div>
            <div class="grid-item" onclick="checkTreasure(this, true)">
                <span style="font-size: 3rem;">🧶</span>
                <span>毛衣幾何圖案</span>
            </div>
        </div>
    </div>

    <!-- 獎勵彈窗 -->
    <div class="reward-overlay" id="rewardOverlay">
        <div class="reward-card">
            🌟 太棒了！圍出了正確的菱形！ 🌟
        </div>
    </div>

    <script>
        /* --- 通用邏輯 --- */
        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.card').forEach((card, i) => {
                card.classList.toggle('active', i === index);
            });

            if (index === 0) drawPressCanvas();
            if (index === 2) initGeoboard();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function showReward() {
            const overlay = document.getElementById('rewardOverlay');
            overlay.style.display = 'flex';
            speak('太棒了！圍出了正確的菱形！');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 1200);
        }

        /* --- 第一關：Canvas 按壓正方形變菱形 --- */
        function drawPressCanvas() {
            const canvas = document.getElementById('canvas-press');
            const ctx = canvas.getContext('2d');
            const angleDeg = document.getElementById('skewSlider').value;
            const angleRad = (angleDeg * Math.PI) / 180;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const side = 130;
            const startX = 110;
            const startY = 250;

            const p1 = { x: startX, y: startY };
            const p2 = { x: startX + side, y: startY };
            const p3 = { x: startX + side + side * Math.sin(angleRad), y: startY - side * Math.cos(angleRad) };
            const p4 = { x: startX + side * Math.sin(angleRad), y: startY - side * Math.cos(angleRad) };

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.fillStyle = '#FFE66D';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#FF5964';
            ctx.stroke();

            ctx.fillStyle = '#2E4057';
            ctx.font = 'bold 18px Arial';
            ctx.fillText("5 cm", (p1.x + p2.x)/2 - 20, p1.y + 30);
            ctx.fillText("5 cm", (p2.x + p3.x)/2 + 10, (p2.y + p3.y)/2);
            ctx.fillText("5 cm", (p3.x + p4.x)/2 - 20, p3.y - 10);
            ctx.fillText("5 cm", (p4.x + p1.x)/2 - 50, (p4.y + p1.y)/2);
        }

        /* --- 第二關：拖拽分類邏輯 --- */
        let countRhombus = 0;
        let countOther = 0;

        document.querySelectorAll('.shape-item').forEach(item => {
            item.addEventListener('pointerdown', onPointerDown);
        });

        function onPointerDown(e) {
            const item = e.currentTarget;
            const rect = item.getBoundingClientRect();
            let shiftX = e.clientX - rect.left;
            let shiftY = e.clientY - rect.top;

            item.style.position = 'fixed';
            item.style.zIndex = 1000;
            moveAt(e.clientX, e.clientY);

            function moveAt(pageX, pageY) {
                item.style.left = pageX - shiftX + 'px';
                item.style.top = pageY - shiftY + 'px';
            }

            function onPointerMove(e) {
                moveAt(e.clientX, e.clientY);
            }

            document.addEventListener('pointermove', onPointerMove);

            item.onpointerup = function(e) {
                document.removeEventListener('pointermove', onPointerMove);
                item.onpointerup = null;

                item.style.display = 'none';
                let elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                item.style.display = 'block';

                let dropZone = elemBelow ? elemBelow.closest('.drop-zone') : null;

                if (dropZone) {
                    let targetType = dropZone.getAttribute('data-target');
                    let shapeType = item.getAttribute('data-type');

                    if (targetType === shapeType) {
                        item.remove();
                        if (targetType === 'rhombus') {
                            countRhombus++;
                            document.getElementById('rhombus-count').innerText = `${countRhombus} / 2`;
                        } else {
                            countOther++;
                            document.getElementById('other-count').innerText = `${countOther} / 2`;
                        }
                        showReward();
                    } else {
                        resetPosition(item);
                        speak("再試一次，看看這是不是菱形？");
                    }
                } else {
                    resetPosition(item);
                }
            };
        }

        function resetPosition(item) {
            item.style.position = 'static';
            item.style.zIndex = 'auto';
        }

        /* --- 第三關：電子釘板邏輯與幾何驗證 --- */
        const canvasG = document.getElementById('canvas-geoboard');
        const ctxG = canvasG.getContext('2d');
        let geoboardPoints = [];
        let showGuide = false;
        let isErrorState = false; // 標記是否處於錯誤顯示狀態

        const gSpacing = 60;
        const gOffsetX = 60;
        const gOffsetY = 60;

        function initGeoboard() {
            drawGeoboard();
        }

        // 幾何公式：計算兩點間距離
        function getDistance(p1, p2) {
            return Math.hypot(p1.x - p2.x, p1.y - p2.y);
        }

        // 計算多邊形面積（避免4點在一條線上）
        function getPolygonArea(pts) {
            let area = 0;
            for (let i = 0; i < pts.length; i++) {
                let j = (i + 1) % pts.length;
                area += pts[i].x * pts[j].y;
                area -= pts[j].x * pts[i].y;
            }
            return Math.abs(area / 2);
        }

        // 嚴格驗證是否為菱形（4條邊相等且面積 > 0）
        function checkIsRhombus(pts) {
            if (pts.length !== 4) return false;

            const d01 = getDistance(pts[0], pts[1]);
            const d12 = getDistance(pts[1], pts[2]);
            const d23 = getDistance(pts[2], pts[3]);
            const d30 = getDistance(pts[3], pts[0]);

            const area = getPolygonArea(pts);

            // 邊長相等（允許 1px 浮點數誤差）且面積大於 0
            const isFourSidesEqual = Math.abs(d01 - d12) < 1 &&
                                     Math.abs(d12 - d23) < 1 &&
                                     Math.abs(d23 - d30) < 1;

            return isFourSidesEqual && area > 10;
        }

        function drawGeoboard() {
            ctxG.clearRect(0, 0, canvasG.width, canvasG.height);

            // 繪製十字輔助線
            if (showGuide) {
                ctxG.beginPath();
                ctxG.setLineDash([6, 6]);
                ctxG.moveTo(gOffsetX + 2*gSpacing, gOffsetY);
                ctxG.lineTo(gOffsetX + 2*gSpacing, gOffsetY + 4*gSpacing);
                ctxG.moveTo(gOffsetX, gOffsetY + 2*gSpacing);
                ctxG.lineTo(gOffsetX + 4*gSpacing, gOffsetY + 2*gSpacing);
                ctxG.strokeStyle = '#35A7FF';
                ctxG.lineWidth = 3;
                ctxG.stroke();
                ctxG.setLineDash([]);
            }

            // 繪製連線與顏色填充
            if (geoboardPoints.length > 0) {
                ctxG.beginPath();
                ctxG.moveTo(geoboardPoints[0].x, geoboardPoints[0].y);
                for (let i = 1; i < geoboardPoints.length; i++) {
                    ctxG.lineTo(geoboardPoints[i].x, geoboardPoints[i].y);
                }

                if (geoboardPoints.length === 4) {
                    ctxG.closePath();
                    if (isErrorState) {
                        ctxG.fillStyle = 'rgba(255, 89, 100, 0.2)';
                        ctxG.strokeStyle = '#FF5964';
                        ctxG.setLineDash([8, 8]);
                    } else {
                        ctxG.fillStyle = 'rgba(78, 205, 196, 0.4)';
                        ctxG.strokeStyle = '#06D6A0';
                        ctxG.setLineDash([]);
                    }
                    ctxG.fill();
                } else {
                    ctxG.strokeStyle = '#FF5964';
                    ctxG.setLineDash([]);
                }

                ctxG.lineWidth = 6;
                ctxG.stroke();
                ctxG.setLineDash([]);
            }

            // 繪製 5x5 釘點
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 5; j++) {
                    ctxG.beginPath();
                    ctxG.arc(gOffsetX + i * gSpacing, gOffsetY + j * gSpacing, 9, 0, Math.PI * 2);
                    ctxG.fillStyle = '#2E4057';
                    ctxG.fill();
                }
            }
        }

        canvasG.addEventListener('pointerdown', function(e) {
            if (geoboardPoints.length >= 4) return;

            const rect = canvasG.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 5; j++) {
                    const px = gOffsetX + i * gSpacing;
                    const py = gOffsetY + j * gSpacing;
                    if (Math.hypot(x - px, y - py) < 25) {
                        if (!geoboardPoints.some(p => p.x === px && p.y === py)) {
                            geoboardPoints.push({ x: px, y: py });
                            
                            // 點滿 4 個點時觸發判定
                            if (geoboardPoints.length === 4) {
                                if (checkIsRhombus(geoboardPoints)) {
                                    isErrorState = false;
                                    drawGeoboard();
                                    showReward();
                                } else {
                                    isErrorState = true;
                                    drawGeoboard();
                                    speak("這不是菱形喔！菱形的4條邊必須一樣長，請再試一次！");
                                    // 1.5 秒後自動重置，方便重新嘗試
                                    setTimeout(() => {
                                        resetGeoboard();
                                    }, 1500);
                                }
                            } else {
                                drawGeoboard();
                            }
                        }
                    }
                }
            }
        });

        function toggleDiagonalGuide() {
            showGuide = !showGuide;
            drawGeoboard();
        }

        function resetGeoboard() {
            geoboardPoints = [];
            isErrorState = false;
            drawGeoboard();
        }

        /* --- 第四關：尋寶小遊戲 --- */
        function checkTreasure(element, isRhombus) {
            if (isRhombus) {
                if (!element.classList.contains('correct')) {
                    element.classList.add('correct');
                    showReward();
                }
            } else {
                element.classList.add('wrong');
                speak("這個不是菱形，再找找看！");
                setTimeout(() => {
                    element.classList.remove('wrong');
                }, 800);
            }
        }

        // 初始化
        window.onload = function() {
            drawPressCanvas();
        };
    </script>
</body>
</html>
